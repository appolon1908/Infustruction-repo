name: Deploy readiness build context regression
on:
  pull_request:
    paths:
      - .github/workflows/reusable-codestra-deploy-readiness.yml
      - .github/workflows/test-deploy-readiness-build-context.yml
      - tests/test_deploy_readiness_build_context.py
      - tests/test_reusable_deploy_readiness_container_contract.py
  push:
    paths:
      - .github/workflows/reusable-codestra-deploy-readiness.yml
      - .github/workflows/test-deploy-readiness-build-context.yml
      - tests/test_deploy_readiness_build_context.py
      - tests/test_reusable_deploy_readiness_container_contract.py
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML==6.0.3 pytest==8.4.2
      - run: python -m unittest discover -s tests -p test_deploy_readiness_build_context.py -v
      - run: python -m pytest -q tests/test_reusable_deploy_readiness_container_contract.py
