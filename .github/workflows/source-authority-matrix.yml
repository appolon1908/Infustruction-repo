name: source-authority-matrix

on:
  # Required contexts must run for every PR, including documentation changes.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$EXPECTED_SHA"
          fi
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python3 scripts/validate_production_source_authority_matrix.py
      - name: Prevent historical evidence from authorizing execution
        run: python3 -m unittest discover -s tests -p test_pr30_evidence_authority.py -v
      - name: Install and run secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          mkdir -p "${RUNNER_TEMP}/tracked-source"
          git archive HEAD | tar -x -C "${RUNNER_TEMP}/tracked-source"
          # The archive has no .git directory: select its reviewed policy explicitly.
          # Show locations, redact secret values, and preserve failure exit codes.
          (cd "${RUNNER_TEMP}/tracked-source" && "${RUNNER_TEMP}/gitleaks" dir --config .gitleaks.toml --no-banner --redact --verbose --exit-code 1 .)
      - name: Verify secret-scan exceptions and negative controls
        if: ${{ !cancelled() }}
        run: python3 scripts/test_gitleaks_policy.py "${RUNNER_TEMP}/gitleaks"

  validate-merge-result:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove merge-result identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$EXPECTED_SHA"
          fi
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python3 scripts/validate_production_source_authority_matrix.py
      - name: Prevent historical evidence from authorizing execution
        run: python3 -m unittest discover -s tests -p test_pr30_evidence_authority.py -v
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/authority-gitleaks"
      - name: Scan complete source tree for secrets
        run: |
          scan_root="${RUNNER_TEMP}/tracked-source"
          mkdir -p "${scan_root}"
          git archive HEAD | tar -x -C "${scan_root}"
          (cd "${scan_root}" && "${RUNNER_TEMP}/authority-gitleaks" dir --config .gitleaks.toml --no-banner --redact --verbose --exit-code 1 .)
      - name: Verify secret-scan exceptions and negative controls
        if: ${{ !cancelled() }}
        run: python3 scripts/test_gitleaks_policy.py "${RUNNER_TEMP}/gitleaks"

  validate:
    name: validate
    if: always()
    needs:
      - validate-source
      - validate-merge-result
    runs-on: ubuntu-latest
    steps:
      - name: Require both exact-source gates
        env:
          SOURCE_RESULT: ${{ needs.validate-source.result }}
          MERGE_RESULT: ${{ needs.validate-merge-result.result }}
        run: |
          set -Eeuo pipefail
          test "${SOURCE_RESULT}" = "success"
          test "${MERGE_RESULT}" = "success"
