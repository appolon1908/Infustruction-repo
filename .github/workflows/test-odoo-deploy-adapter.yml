name: Odoo deployment adapter safety
on:
  pull_request:
    paths:
      - 'operators/codestra-deploy*'
      - 'release/templates/odoo-*'
      - 'scripts/build_codestra_deploy_package.py'
      - 'tests/test_codestra_deploy*'
      - '.github/workflows/test-odoo-deploy-adapter.yml'
      - '.github/workflows/release-codestra-deploy-controller.yml'
permissions:
  contents: read
jobs:
  unprivileged-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input pytest==8.4.2
      - run: python -m pytest -q tests/test_codestra_deploy_controller.py tests/test_codestra_deploy_odoo_adapter.py tests/test_codestra_deploy_package.py tests/test_codestra_deploy_release_workflow.py tests/test_codestra_deploy_review_regressions.py
        env:
          CODESTRA_TEST_UNPRIVILEGED: '1'
      - run: python -m py_compile operators/codestra-deploy operators/codestra-deploy-odoo scripts/build_codestra_deploy_package.py
      - run: bash -n operators/install-codestra-deploy-package
