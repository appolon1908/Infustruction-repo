name: Validate Stage 6 authoritative source lock

on:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  pull_request:
    paths:
      - "STAGE6-SOURCE-LOCK.yaml"
      - "STAGE6-SOURCE-LOCK.RESOLVED.yaml"
      - "deploy/staging/intake-observability/**"
      - "deploy/staging/runtime-reconciliation/**"
      - "releases/STAGE6-STAGING-EXACT-SOURCE-LOCK-2026-08-30.json"
      - "reports/runtime-reconciliation/**"
      - "releases/STAGE6-STAGING-DEPLOYMENT-PLAN-2026-08-30.yaml"
      - "scripts/build_stage6_reconciliation_matrix.py"
      - "scripts/generate_stage6_evidence_checksums.py"
      - "scripts/prepare_stage6_locked_checkouts.py"
      - "scripts/resolve_stage6_source_lock.py"
      - "scripts/validate_stage6_authority_heads.py"
      - "scripts/validate_stage6_remediation.py"
      - "scripts/validate_stage6_resolved_source_lock.py"
      - "scripts/validate_stage6_source_lock.py"
      - "scripts/validate_stage6_staging_plan.py"
      - "scripts/verify_stage6_middleware_artifact.py"
      - "tests/test_stage6_source_regressions.py"
      - "tests/test_stage6_authority_heads.py"
      - "docs/STAGE6-AUTHORITY-HEAD-VALIDATION.md"
      - ".github/workflows/stage6-source-regressions.yml"
      - ".github/workflows/validate-stage6-source-lock.yml"
  push:
    branches: [main]
    paths:
      - "STAGE6-SOURCE-LOCK.yaml"
      - "STAGE6-SOURCE-LOCK.RESOLVED.yaml"
      - "deploy/staging/intake-observability/**"
      - "deploy/staging/runtime-reconciliation/**"
      - "releases/STAGE6-STAGING-EXACT-SOURCE-LOCK-2026-08-30.json"
      - "reports/runtime-reconciliation/**"
      - "releases/STAGE6-STAGING-DEPLOYMENT-PLAN-2026-08-30.yaml"
      - "scripts/build_stage6_reconciliation_matrix.py"
      - "scripts/generate_stage6_evidence_checksums.py"
      - "scripts/prepare_stage6_locked_checkouts.py"
      - "scripts/resolve_stage6_source_lock.py"
      - "scripts/validate_stage6_authority_heads.py"
      - "scripts/validate_stage6_remediation.py"
      - "scripts/validate_stage6_resolved_source_lock.py"
      - "scripts/validate_stage6_source_lock.py"
      - "scripts/validate_stage6_staging_plan.py"
      - "scripts/verify_stage6_middleware_artifact.py"
      - "tests/test_stage6_source_regressions.py"
      - "tests/test_stage6_authority_heads.py"
      - "docs/STAGE6-AUTHORITY-HEAD-VALIDATION.md"
      - ".github/workflows/stage6-source-regressions.yml"
      - ".github/workflows/validate-stage6-source-lock.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - run: python -m py_compile scripts/build_stage6_reconciliation_matrix.py scripts/generate_stage6_evidence_checksums.py scripts/prepare_stage6_locked_checkouts.py scripts/resolve_stage6_source_lock.py scripts/validate_stage6_authority_heads.py scripts/validate_stage6_remediation.py scripts/validate_stage6_resolved_source_lock.py scripts/validate_stage6_source_lock.py scripts/validate_stage6_staging_plan.py scripts/verify_stage6_middleware_artifact.py
      - name: Validate remediation pins and migration isolation
        run: |
          python scripts/validate_stage6_remediation.py
          python -O scripts/validate_stage6_remediation.py
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p test_stage6_source_regressions.py -v
      - name: Offline authority regression tests
        run: |
          python -m unittest discover -s tests -p test_stage6_authority_heads.py -v
          python -O -m unittest discover -s tests -p test_stage6_authority_heads.py -v
      - run: python scripts/build_stage6_reconciliation_matrix.py
      - run: git diff --exit-code -- reports/runtime-reconciliation/STAGE6-RECONCILIATION-MATRIX.csv
      - name: Verify deterministic evidence checksums
        run: |
          python scripts/generate_stage6_evidence_checksums.py
          git diff --exit-code -- reports/runtime-reconciliation/STAGE6-EVIDENCE-SHA256SUMS
          sha256sum --check reports/runtime-reconciliation/STAGE6-EVIDENCE-SHA256SUMS
      - run: python scripts/validate_stage6_source_lock.py
      - run: python scripts/validate_stage6_staging_plan.py
      - run: python scripts/validate_stage6_resolved_source_lock.py
      # Artifact verification is independent of authority-head reachability.
      # Run it before the authority gate so a failed live query cannot skip
      # digest/signature/SPDX checks.
      - name: Verify locked artifacts independently
        if: ${{ !cancelled() }}
        run: python scripts/verify_stage6_middleware_artifact.py
      # Never expose a cross-repository credential to PR-controlled code or turn
      # external-head drift into a passing source-lock result.
      - name: Validate live authority heads
        id: authority_heads
        run: python scripts/validate_stage6_authority_heads.py --json-report "$RUNNER_TEMP/stage6-authority-heads.json"
      - name: Preserve authority diagnostics in job summary
        if: ${{ !cancelled() && steps.authority_heads.outcome != 'skipped' }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/stage6-authority-heads.json" ]; then
            {
              printf '### Stage 6 authority diagnostics\n\n```json\n'
              cat "$RUNNER_TEMP/stage6-authority-heads.json"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
