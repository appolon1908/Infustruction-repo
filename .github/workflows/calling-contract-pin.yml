name: calling-contract-pin

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - ".codestra/calling-contract.lock.json"
      - ".github/workflows/calling-contract-pin.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CONTRACT_DIGEST: b39cdffe56a8185c91174228f0423df68b1137f34875f6ee52f9914f904bf724
  CONTRACT_AUTHORITY: appolon1908-hue/codestra-production-platform#257
  CONTRACT_ROLE: deployment

jobs:
  verify-head:
    name: verify-head
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact source and complete lock schema
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              "version": "1.0.0",
              "sha256": os.environ["CONTRACT_DIGEST"],
              "authority": os.environ["CONTRACT_AUTHORITY"],
              "role": os.environ["CONTRACT_ROLE"],
              "external_effects_enabled": False,
          }

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON field: {key}")
                  result[key] = value
              return result

          raw = Path(".codestra/calling-contract.lock.json").read_text(encoding="utf-8")
          document = json.loads(raw, object_pairs_hook=reject_duplicates)
          if type(document) is not dict or set(document) != set(expected):
              raise SystemExit("calling contract lock schema mismatch")
          for field in ("version", "sha256", "authority", "role"):
              if type(document[field]) is not str or document[field] != expected[field]:
                  raise SystemExit(f"calling contract {field} mismatch")
          if type(document["external_effects_enabled"]) is not bool or document["external_effects_enabled"] is not False:
              raise SystemExit("external_effects_enabled must be JSON boolean false")

          for sample in (
              '{"external_effects_enabled":true,"external_effects_enabled":false}',
              '{"external_effects_enabled":false,"external_effects_enabled":true}',
              '{"authority":"wrong","authority":"appolon1908-hue/codestra-production-platform#257"}',
          ):
              try:
                  json.loads(sample, object_pairs_hook=reject_duplicates)
              except ValueError:
                  continue
              raise SystemExit("duplicate-key negative fixture was accepted")
          print("CALLING_CONTRACT_PIN=PASS")
          PY
          git diff --check

  verify-merge-result:
    name: verify-merge-result
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out synthetic merge result
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate merge-result lock
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              "version": "1.0.0",
              "sha256": os.environ["CONTRACT_DIGEST"],
              "authority": os.environ["CONTRACT_AUTHORITY"],
              "role": os.environ["CONTRACT_ROLE"],
              "external_effects_enabled": False,
          }
          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON field: {key}")
                  result[key] = value
              return result
          document = json.loads(
              Path(".codestra/calling-contract.lock.json").read_text(encoding="utf-8"),
              object_pairs_hook=reject_duplicates,
          )
          if type(document) is not dict or set(document) != set(expected):
              raise SystemExit("calling contract lock schema mismatch")
          if document != expected or type(document["external_effects_enabled"]) is not bool:
              raise SystemExit("calling contract merge-result mismatch")
          print("CALLING_CONTRACT_MERGE_RESULT=PASS")
          PY
          git diff --check

  verify:
    name: verify
    if: always()
    needs: [verify-head, verify-merge-result]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable validations
        env:
          HEAD_RESULT: ${{ needs.verify-head.result }}
          MERGE_RESULT: ${{ needs.verify-merge-result.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          test "${HEAD_RESULT}" = success
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            test "${MERGE_RESULT}" = success
          else
            test "${MERGE_RESULT}" = skipped
          fi
