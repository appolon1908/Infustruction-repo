name: Validate Stage 6 intake observability infrastructure

on:
  pull_request:
    paths:
      - "deploy/staging/intake-observability/**"
      - "scripts/deploy_intake_observability_staging.sh"
      - "scripts/validate_intake_observability_staging.py"
      - ".github/workflows/validate-stage6-intake-observability.yml"
  push:
    branches: [main]
    paths:
      - "deploy/staging/intake-observability/**"
      - "scripts/deploy_intake_observability_staging.sh"
      - "scripts/validate_intake_observability_staging.py"
      - ".github/workflows/validate-stage6-intake-observability.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3
      - run: python -m py_compile scripts/validate_intake_observability_staging.py
      - run: python scripts/validate_intake_observability_staging.py
      - run: bash -n scripts/deploy_intake_observability_staging.sh
      - name: Preserve staging-only boundary
        run: |
          echo 'TARGET_ENVIRONMENT=staging'
          echo 'MIDDLEWARE_HOST_PORTS=none'
          echo 'PROMETHEUS_TARGET=pending'
          echo 'BLACKBOX_TARGET=pending'
          echo 'PRODUCTION_AUTHORIZED=NO'
