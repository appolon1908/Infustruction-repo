name: Provenance integrity regression
on:
  pull_request:
    paths:
      - .github/workflows/reusable-codestra-deploy-readiness.yml
      - .github/workflows/test-provenance-integrity.yml
      - tests/test_reusable_provenance.py
      - tests/fixtures/cosign_provenance_roundtrip_test.go
  push:
    paths:
      - .github/workflows/reusable-codestra-deploy-readiness.yml
      - .github/workflows/test-provenance-integrity.yml
      - tests/test_reusable_provenance.py
      - tests/fixtures/cosign_provenance_roundtrip_test.go
permissions:
  contents: read
jobs:
  provenance:
    name: provenance-integrity / ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: [source-head, merge-result]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.candidate == 'source-head' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify selected checkout
        env:
          EXPECTED_SHA: ${{ matrix.candidate == 'source-head' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3 pytest==8.4.2
      - name: Prepare synthetic predicate from the actual workflow generator
        run: |
          python - <<'PY'
          import os, pathlib, re, runpy
          module = runpy.run_path("tests/test_reusable_provenance.py")
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "provenance-roundtrip"
          root.mkdir()
          module["generated"](root)
          types = re.findall(r"--type (https://slsa.dev/provenance/v1)", module["RELEASE"])
          assert len(types) == 2
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CODESTRA_PROVENANCE_TYPE={types[0]}\n")
              output.write(f"CODESTRA_COSIGN_PREDICATE={root}/evidence/provenance.json\n")
              output.write(f"CODESTRA_COSIGN_OUTPUT={root}/statement.json\n")
          PY
      - name: Check out the exact Cosign source matching the release binary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sigstore/cosign
          ref: 193d2153431f8bb0d945a4c1ee721872f73add67 # v3.1.2
          path: .ci-cosign
          persist-credentials: false
      - name: Exercise real pinned Cosign serialization without signing or publishing
        env:
          GOTOOLCHAIN: auto
          GOWORK: "off"
          GOSUMDB: sum.golang.org
        run: |
          set -Eeuo pipefail
          test "$(git -C .ci-cosign rev-parse HEAD)" = 193d2153431f8bb0d945a4c1ee721872f73add67
          cp tests/fixtures/cosign_provenance_roundtrip_test.go .ci-cosign/pkg/cosign/attestation/codestra_roundtrip_test.go
          cd .ci-cosign
          go test -mod=readonly -run '^TestCodestraProvenanceRoundTrip$' ./pkg/cosign/attestation
          git diff --exit-code -- go.mod go.sum
      - name: Require full predicate preservation and all negative regressions
        run: |
          test -s "$CODESTRA_COSIGN_OUTPUT"
          test -s "$CODESTRA_COSIGN_OUTPUT.legacy"
          python -m pytest -q tests/test_reusable_provenance.py
