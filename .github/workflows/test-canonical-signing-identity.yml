name: Canonical reusable signing identity regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  canonical-signing-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate exact canonical identity and unchanged pinned controls
        run: |
          python3 -m unittest discover -s tests -p test_canonical_signing_identity.py -v
          python3 -m unittest discover -s tests -p test_upstream_signing_identity.py -v
