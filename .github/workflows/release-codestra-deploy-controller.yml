name: Release Codestra deployment controller package
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected main SHA
        required: true
        type: string
      confirmation:
        description: Fixed release confirmation
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: release-codestra-deploy-controller
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    environment: deployment-controller-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected source and confirmation
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = RELEASE_DEPLOYMENT_CONTROLLER_PACKAGE
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run package and controller tests
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input pytest==8.4.2
          python3 -m pytest -q tests/test_codestra_deploy_controller.py tests/test_codestra_deploy_odoo_adapter.py tests/test_codestra_deploy_package.py
          python3 -m py_compile operators/codestra-deploy operators/codestra-deploy-odoo
          bash -n operators/install-codestra-deploy-package operators/install-klyrow-odoo-smtp-export-policy
      - name: Build deterministic non-authorizing package
        run: |
          mkdir -p dist
          python3 scripts/build_codestra_deploy_package.py --source-sha "$GITHUB_SHA" --output dist/codestra-deploy-controller.tar.gz
      - name: Install checksum-pinned Cosign
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64
          echo 'f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf  '${RUNNER_TEMP}'/cosign' | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/cosign"
      - name: Sign manifest with workload identity
        run: "$RUNNER_TEMP/cosign sign-blob --yes --bundle dist/codestra-deploy-controller.manifest.sigstore.json dist/codestra-deploy-controller.tar.gz.manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codestra-deploy-controller-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
