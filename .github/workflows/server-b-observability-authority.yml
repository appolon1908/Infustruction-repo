name: Server B observability authority

on:
  pull_request:
    paths:
      - "hosts/37.27.128.39/observability/**"
      - ".github/workflows/server-b-observability-authority.yml"
      - "config/observability/repository-registry.v1.json"
      - "tests/test_server_b_observability.py"
  push:
    branches: [development, test, staging, production, main]
    paths:
      - "hosts/37.27.128.39/observability/**"
      - ".github/workflows/server-b-observability-authority.yml"
      - "config/observability/repository-registry.v1.json"
      - "tests/test_server_b_observability.py"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        identity: [source, merge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && matrix.identity == 'source' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && matrix.identity == 'source' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Reproduce evidence
        run: python3 hosts/37.27.128.39/observability/generate_evidence.py
      - name: Reject generated drift
        run: |
          set -Eeuo pipefail
          scope=hosts/37.27.128.39/observability
          git diff --exit-code -- "$scope"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- "$scope")"
      - name: Validate fail-closed authority
        run: python3 hosts/37.27.128.39/observability/validate.py
      - name: Validate with Python assertions disabled
        run: python3 -O hosts/37.27.128.39/observability/validate.py
      - name: Regression tests for scope, activation, and deleted evidence
        run: python3 -m unittest discover -s tests -p test_server_b_observability.py -v
