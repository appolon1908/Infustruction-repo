name: PR queue candidate objects

on:
  push:
    branches: [fix/pr-queue-source-snapshot-20260906]

permissions:
  contents: read

jobs:
  objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Upload checksum-verified blobs only
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: python3 operations/pr-queue-objects/publish_blobs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-queue-candidate-objects
          path: |
            candidate-objects.json
            operations/pr-queue-objects/
          retention-days: 3
          if-no-files-found: error
