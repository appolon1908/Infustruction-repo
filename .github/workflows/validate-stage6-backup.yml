name: Validate Stage 6 staging backup operation

on:
  pull_request:
    paths:
      - "scripts/backup_stage6_staging.sh"
      - "scripts/verify_stage6_staging_backup.sh"
      - ".github/workflows/validate-stage6-backup.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash -n scripts/backup_stage6_staging.sh scripts/verify_stage6_staging_backup.sh
      - name: Validate staging-only safety boundaries
        run: |
          set -Eeuo pipefail
          grep -q 'runtime_reconciliation_allowed: false' scripts/backup_stage6_staging.sh
          grep -q 'PRODUCTION_TOUCHED=NO' scripts/backup_stage6_staging.sh
          ! grep -Eq 'docker (restart|stop|rm)|docker compose (up|down)|alembic|--update|--init' scripts/backup_stage6_staging.sh
      - name: Validate version-matched restore inspection
        run: |
          set -Eeuo pipefail
          grep -q "approved_postgres_digest='sha256:" scripts/verify_stage6_staging_backup.sh
          grep -q "State.Health.Status" scripts/verify_stage6_staging_backup.sh
          grep -q 'docker exec -i "\$restore_container" pg_restore --list' scripts/verify_stage6_staging_backup.sh
          ! grep -Eq 'docker (restart|stop|rm)|docker compose (up|down)|pg_restore .*--restore' scripts/verify_stage6_staging_backup.sh
