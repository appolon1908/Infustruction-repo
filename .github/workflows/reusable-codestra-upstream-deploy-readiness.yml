name: Reusable Codestra upstream deploy readiness

on:
  workflow_call:
    inputs:
      repository_class:
        description: Repository workload class
        required: true
        type: string
      runtime_deployable:
        description: Whether protected staging and read-only production jobs are valid
        required: true
        type: boolean
      health_paths:
        description: Comma-separated health, readiness, and version paths
        required: false
        type: string
        default: ""
      operation:
        description: verify, release, deploy-staging-readonly, certify-staging-readonly, or promote-production-readonly
        required: false
        type: string
        default: verify
      confirmation:
        description: Fixed confirmation required for deployment operations
        required: false
        type: string
        default: ""
      canary_percent:
        description: Production read-only canary percentage; maximum 1
        required: false
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: upstream-deploy-readiness-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_READINESS_CONTRACT_VERSION: "3"
  REPOSITORY_CLASS: "${{ inputs.repository_class }}"
  RUNTIME_DEPLOYABLE: "${{ inputs.runtime_deployable }}"
  HEALTH_PATHS: "${{ inputs.health_paths }}"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "v0.72.0"
  TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
  COSIGN_VERSION: "v3.1.2"
  COSIGN_SHA256: "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf"

jobs:
  overlay-source-ci:
    name: deploy-readiness / overlay-source-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean checkout and bind upstream tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "SOURCE_SHA=$EXPECTED_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          if [[ -d upstream ]]; then
            test -n "$(git ls-files upstream | head -n1)"
            echo "UPSTREAM_TREE=$(git rev-parse HEAD:upstream)"
            echo "UPSTREAM_TRACKED_FILES=$(git ls-files upstream | wc -l | tr -d ' ')"
          else
            echo "UPSTREAM_TREE=ABSENT"
            echo "UPSTREAM_TRACKED_FILES=0"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate Codestra-owned overlay configuration
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import re
          import yaml

          root = pathlib.Path(".").resolve()
          excluded = {
              ".git", ".nuxt", ".output", ".venv", ".venv-ci", "__pycache__",
              "build", "coverage", "dist", "node_modules", "upstream", "vendor",
          }
          conflict = re.compile(r"^(?:<{7}|={7}|>{7})(?: .*)?$", re.MULTILINE)
          counts = {"json": 0, "yaml": 0, "text": 0}

          for path in root.rglob("*"):
              rel = path.relative_to(root)
              if any(part in excluded for part in rel.parts):
                  continue
              if path.is_symlink():
                  target = path.resolve(strict=False)
                  try:
                      target.relative_to(root)
                  except ValueError:
                      raise SystemExit(f"symlink escapes overlay: {rel} -> {target}")
              if not path.is_file():
                  continue
              size = path.stat().st_size
              if size > 50 * 1024 * 1024:
                  raise SystemExit(f"overlay file exceeds 50 MiB: {rel}")
              if size > 5 * 1024 * 1024:
                  continue

              suffix = path.suffix.lower()
              if suffix == ".json" and size:
                  try:
                      json.loads(path.read_text(encoding="utf-8"))
                  except Exception as exc:
                      raise SystemExit(f"invalid overlay JSON in {rel}: {exc}") from exc
                  counts["json"] += 1
              elif suffix in {".yaml", ".yml"} and size:
                  try:
                      list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
                  except Exception as exc:
                      raise SystemExit(f"invalid overlay YAML in {rel}: {exc}") from exc
                  counts["yaml"] += 1

              if suffix in {
                  ".c", ".cc", ".cpp", ".css", ".go", ".h", ".html", ".java",
                  ".js", ".json", ".jsx", ".md", ".mdx", ".php", ".py", ".rb",
                  ".rs", ".sh", ".sql", ".ts", ".tsx", ".txt", ".vue", ".yaml", ".yml",
              }:
                  text = path.read_text(encoding="utf-8", errors="replace")
                  if conflict.search(text):
                      raise SystemExit(f"unresolved merge marker in overlay: {rel}")
                  counts["text"] += 1

          print("REPOSITORY_CLASS=" + os.environ["REPOSITORY_CLASS"])
          print("HEALTH_PATHS=" + os.environ["HEALTH_PATHS"])
          print("VALIDATED_OVERLAY_JSON_FILES=" + str(counts["json"]))
          print("VALIDATED_OVERLAY_YAML_FILES=" + str(counts["yaml"]))
          print("VALIDATED_OVERLAY_TEXT_FILES=" + str(counts["text"]))
          print("UPSTREAM_FIXTURES_EXCLUDED_FROM_OVERLAY_VALIDATION=YES")
          print("OVERLAY_STRUCTURE_VALIDATION=PASS")
          PY
          git diff --check

      - name: Validate overlay Compose files
        run: |
          set -Eeuo pipefail
          while IFS= read -r compose; do
            echo "COMPOSE_FILE=$compose"
            docker compose -f "$compose" config --quiet
          done < <(
            find . -path './upstream' -prune -o -maxdepth 5 -type f \
              \( -name compose.yml -o -name compose.yaml -o -name docker-compose.yml -o -name docker-compose.yaml \) \
              -print | sort
          )

      - name: Emit source readiness summary
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## Codestra upstream deploy readiness"
            echo
            echo "- Contract: \`${DEPLOY_READINESS_CONTRACT_VERSION}\`"
            echo "- Repository class: \`${REPOSITORY_CLASS}\`"
            echo "- Exact source: \`${EXACT_SHA}\`"
            echo "- Codestra overlay: validated"
            echo "- Public upstream mirror: tree-bound and excluded from generic fixture parsing"
            echo "- Runtime deployment authorized by this PR: **No**"
            echo "- External effects authorized by this PR: **No**"
          } >> "$GITHUB_STEP_SUMMARY"

  overlay-secret-scan:
    name: deploy-readiness / overlay-secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"

      - name: Scan only the Codestra-owned overlay
        run: |
          set -Eeuo pipefail
          scan_root="${RUNNER_TEMP}/tracked-overlay"
          report="${RUNNER_TEMP}/gitleaks-report.json"
          mkdir -p "$scan_root"
          git archive HEAD | tar -x -C "$scan_root"
          rm -rf "$scan_root/upstream"
          set +e
          (
            cd "$scan_root"
            "$RUNNER_TEMP/gitleaks" dir \
              --no-banner \
              --redact \
              --report-format json \
              --report-path "$report" \
              --exit-code 1 \
              .
          )
          status=$?
          set -e
          python - "$report" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          findings = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else []
          for finding in findings:
              print(
                  "SECRET_SCAN_FINDING="
                  f"rule:{finding.get('RuleID', 'unknown')};"
                  f"file:{finding.get('File', 'unknown')};"
                  f"line:{finding.get('StartLine', 'unknown')}"
              )
          print(f"SECRET_SCAN_FINDING_COUNT={len(findings)}")
          print("PUBLIC_UPSTREAM_FIXTURES_SCANNED_BY_GENERIC_GATE=NO")
          PY
          exit "$status"

  immutable-source-candidate:
    name: deploy-readiness / immutable-source-candidate
    needs:
      - overlay-source-ci
      - overlay-secret-scan
    if: >-
      (github.event_name == 'push' &&
       (github.ref_name == 'main' || github.ref_name == 'staging' || github.ref_name == 'production')) ||
      (inputs.operation != 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    outputs:
      artifact_kind: ${{ steps.release.outputs.artifact_kind }}
      artifact_reference: ${{ steps.release.outputs.artifact_reference }}
      artifact_digest: ${{ steps.release.outputs.artifact_digest }}
    steps:
      - name: Restrict release authority
        run: |
          set -Eeuo pipefail
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/staging|refs/heads/production) ;;
            *) echo "RELEASE_ERROR=release authority requires main, staging, or production" >&2; exit 1 ;;
          esac
          case "${{ inputs.operation }}" in
            verify|release|deploy-staging-readonly|certify-staging-readonly|promote-production-readonly) ;;
            *) echo "RELEASE_ERROR=unsupported operation" >&2; exit 1 ;;
          esac

      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Trivy and Cosign
        run: |
          set -Eeuo pipefail
          trivy_version="${TRIVY_VERSION#v}"
          trivy_archive="${RUNNER_TEMP}/trivy.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${trivy_version}_Linux-64bit.tar.gz" \
            --output "$trivy_archive"
          echo "${TRIVY_SHA256}  ${trivy_archive}" | sha256sum --check --strict
          tar -xzf "$trivy_archive" -C "$RUNNER_TEMP" trivy
          chmod 0755 "$RUNNER_TEMP/trivy"

          cosign_bin="${RUNNER_TEMP}/cosign"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            --output "$cosign_bin"
          echo "${COSIGN_SHA256}  ${cosign_bin}" | sha256sum --check --strict
          chmod 0755 "$cosign_bin"

      - name: Build, scan, sign, and publish exact overlay source bundle
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p evidence overlay-source
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

          git archive HEAD | tar -x -C overlay-source
          rm -rf overlay-source/upstream
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf evidence/codestra-overlay-source.tar.gz \
            -C overlay-source .

          "$RUNNER_TEMP/trivy" fs \
            --scanners vuln,misconfig \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format json \
            --output evidence/vulnerability-report.json \
            overlay-source

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          overlay = pathlib.Path("overlay-source")
          evidence = pathlib.Path("evidence")
          records = []
          for path in sorted(p for p in overlay.rglob("*") if p.is_file()):
              records.append({
                  "path": path.relative_to(overlay).as_posix(),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              })
          (evidence / "overlay-file-sbom.json").write_text(
              json.dumps({"schema_version": 1, "files": records}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          upstream_tree = None
          upstream_files = 0
          if pathlib.Path("upstream").is_dir():
              upstream_tree = subprocess.check_output(
                  ["git", "rev-parse", "HEAD:upstream"], text=True
              ).strip()
              upstream_files = int(subprocess.check_output(
                  ["bash", "-lc", "git ls-files upstream | wc -l"], text=True
              ).strip())

          provenance = {
              "buildDefinition": {
                  "buildType": "https://codestra.co/upstream-overlay/v1",
                  "externalParameters": {
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "source_sha": os.environ["GITHUB_SHA"],
                      "repository_class": os.environ["REPOSITORY_CLASS"],
                  },
                  "internalParameters": {},
                  "resolvedDependencies": [{
                      "uri": f"git+https://github.com/{os.environ['GITHUB_REPOSITORY']}@{os.environ['GITHUB_SHA']}",
                      "digest": {"gitCommit": os.environ["GITHUB_SHA"]},
                  }],
              },
              "runDetails": {
                  "builder": {
                      "id": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
                  },
                  "metadata": {
                      "invocationId": f"{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}"
                  },
                  "byproducts": [],
              },
          }
          (evidence / "provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          bundle = evidence / "codestra-overlay-source.tar.gz"
          manifest = {
              "schema_version": 1,
              "contract_version": os.environ["DEPLOY_READINESS_CONTRACT_VERSION"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_class": os.environ["REPOSITORY_CLASS"],
              "source_sha": os.environ["GITHUB_SHA"],
              "source_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "upstream_tree": upstream_tree,
              "upstream_tracked_files": upstream_files,
              "bundle_digest": "sha256:" + hashlib.sha256(bundle.read_bytes()).hexdigest(),
              "sbom_sha256": "sha256:" + hashlib.sha256(
                  (evidence / "overlay-file-sbom.json").read_bytes()
              ).hexdigest(),
              "provenance_sha256": "sha256:" + hashlib.sha256(
                  (evidence / "provenance.json").read_bytes()
              ).hexdigest(),
              "vulnerability_report_sha256": "sha256:" + hashlib.sha256(
                  (evidence / "vulnerability-report.json").read_bytes()
              ).hexdigest(),
              "health_paths": [
                  item for item in os.environ["HEALTH_PATHS"].split(",") if item
              ],
              "runtime_deployment_authorized": False,
              "external_effects_authorized": False,
          }
          (evidence / "deploy-readiness-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          manifest=evidence/deploy-readiness-manifest.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/codestra-deploy-readiness.yml@${GITHUB_REF}"
          "$RUNNER_TEMP/cosign" sign-blob \
            --yes \
            --bundle evidence/deploy-readiness-manifest.sigstore.json \
            "$manifest"
          "$RUNNER_TEMP/cosign" verify-blob \
            --bundle evidence/deploy-readiness-manifest.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$manifest"

          (
            cd evidence
            find . -maxdepth 1 -type f ! -name checksums.sha256 -print0 | \
              sort -z | \
              xargs -0 sha256sum > checksums.sha256
            sha256sum --check --strict checksums.sha256
          )

          source_digest="sha256:$(sha256sum evidence/codestra-overlay-source.tar.gz | awk '{print $1}')"
          tag="deploy-ready-overlay-${source_sha}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" evidence/* --clobber
          else
            gh release create "$tag" evidence/* \
              --target "$source_sha" \
              --title "Deploy-ready overlay ${source_sha}" \
              --notes "Exact signed Codestra overlay candidate. Public upstream source remains tree-bound; runtime deployment is separately gated."
          fi
          echo "artifact_kind=source-bundle" >> "$GITHUB_OUTPUT"
          echo "artifact_reference=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=${source_digest}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-ready-overlay-${{ github.ref_name }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  staging-readonly:
    name: deploy-readiness / staging-readonly
    needs:
      - immutable-source-candidate
    if: >-
      inputs.runtime_deployable &&
      (inputs.operation == 'deploy-staging-readonly' || inputs.operation == 'certify-staging-readonly')
    runs-on:
      - self-hosted
      - codestra-staging
    timeout-minutes: 45
    environment:
      name: staging-readonly
    permissions:
      contents: read
    steps:
      - name: Enforce fixed staging confirmation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          case "${OPERATION}:${CONFIRMATION}" in
            deploy-staging-readonly:DEPLOY_STAGING_READONLY) ;;
            certify-staging-readonly:CERTIFY_STAGING_READONLY) ;;
            *) echo "STAGING_ERROR=invalid fixed confirmation" >&2; exit 1 ;;
          esac
          test -x /usr/local/bin/codestra-deploy

      - name: Execute protected exact-artifact staging operation
        env:
          ARTIFACT_REFERENCE: ${{ needs.immutable-source-candidate.outputs.artifact_reference }}
          ARTIFACT_DIGEST: ${{ needs.immutable-source-candidate.outputs.artifact_digest }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          /usr/local/bin/codestra-deploy "$OPERATION" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --artifact-kind source-bundle \
            --artifact-reference "$ARTIFACT_REFERENCE" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --environment staging-readonly \
            --health-paths "$HEALTH_PATHS" \
            --read-only \
            --deny-external-effects \
            --evidence-output "$RUNNER_TEMP/staging-readiness-evidence.json"

      - name: Upload sanitized staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-readiness-${{ github.repository_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/staging-readiness-evidence.json
          if-no-files-found: error
          retention-days: 30

  production-readonly-canary:
    name: deploy-readiness / production-readonly-canary
    needs:
      - immutable-source-candidate
    if: >-
      inputs.runtime_deployable &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'promote-production-readonly'
    runs-on:
      - self-hosted
      - codestra-production-canary
    timeout-minutes: 60
    environment:
      name: production-readonly-canary
    permissions:
      contents: read
    steps:
      - name: Enforce fixed production confirmation and maximum one percent
        env:
          CANARY_PERCENT: ${{ inputs.canary_percent }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = "PROMOTE_PRODUCTION_READONLY"
          python3 - <<'PY'
          import os
          value = float(os.environ["CANARY_PERCENT"])
          if not 0 < value <= 1:
              raise SystemExit("canary_percent must be greater than zero and no more than one")
          PY
          test -x /usr/local/bin/codestra-deploy

      - name: Promote exact overlay through a GET/HEAD-only canary
        env:
          ARTIFACT_REFERENCE: ${{ needs.immutable-source-candidate.outputs.artifact_reference }}
          ARTIFACT_DIGEST: ${{ needs.immutable-source-candidate.outputs.artifact_digest }}
          CANARY_PERCENT: ${{ inputs.canary_percent }}
        run: |
          set -Eeuo pipefail
          /usr/local/bin/codestra-deploy promote-production-readonly \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --artifact-kind source-bundle \
            --artifact-reference "$ARTIFACT_REFERENCE" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --environment production-readonly-canary \
            --health-paths "$HEALTH_PATHS" \
            --canary-percent "$CANARY_PERCENT" \
            --allowed-methods GET,HEAD \
            --require-staging-certification \
            --require-backup \
            --require-isolated-restore \
            --require-rollback-rehearsal \
            --deny-external-effects \
            --evidence-output "$RUNNER_TEMP/production-canary-evidence.json"

      - name: Upload sanitized production-canary evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-readonly-canary-${{ github.repository_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/production-canary-evidence.json
          if-no-files-found: error
          retention-days: 90
