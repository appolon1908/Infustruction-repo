name: production-immutable-candidate-matrix

on:
  pull_request:
    paths:
      - PRODUCTION-IMMUTABLE-CANDIDATE-MATRIX.yaml
      - scripts/validate_production_immutable_candidate_matrix.py
      - .github/workflows/production-immutable-candidate-matrix.yml

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prove exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pyyaml==6.0.2
      - run: python scripts/validate_production_immutable_candidate_matrix.py
      - name: Scan tracked source for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          mkdir -p "${RUNNER_TEMP}/tracked-source"
          git archive HEAD | tar -x -C "${RUNNER_TEMP}/tracked-source"
          (cd "${RUNNER_TEMP}/tracked-source" && "${RUNNER_TEMP}/gitleaks" dir --no-banner --redact --exit-code 1 .)

  validate-merge-result:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prove merge-result identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pyyaml==6.0.2
      - run: python scripts/validate_production_immutable_candidate_matrix.py
