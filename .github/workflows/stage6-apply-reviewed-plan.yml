name: Stage 6 apply exact reviewed plan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Exact reviewed-plan operation"
        required: true
        type: string
      plan_run_id:
        description: "Workflow run that produced the reviewed plan"
        required: true
        type: string
      plan_sha:
        description: "Exact source SHA used to create the reviewed plan"
        required: true
        type: string
      plan_artifact_name:
        description: "Exact reviewed plan artifact name"
        required: true
        type: string
      plan_artifact_digest:
        description: "GitHub artifact SHA-256 digest"
        required: true
        type: string
      confirmation:
        description: "Type APPLY_EXACT_REVIEWED_STAGE6_PLAN"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: stage6-apply-reviewed-plan
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  IAC_DIR: plan-source/infra/hetzner/stage6-staging
  REVIEWED_PLAN_RUN_ID: "33439673272"
  REVIEWED_PLAN_SHA: "2774473fe221895185ca74228266478d2da2b13f"
  REVIEWED_ARTIFACT_NAME: stage6-remote-plan-2774473fe221895185ca74228266478d2da2b13f
  REVIEWED_ARTIFACT_DIGEST: sha256:98d172506c197f0b010d419aba01bfd8631ba4dffed0bbf549cda38b92423bc0

jobs:
  verify-reviewed-plan:
    if: github.ref == 'refs/heads/main' && github.ref_protected == true && inputs.mode == 'APPLY_REVIEWED_STAGE6_PLAN' && inputs.confirmation == 'APPLY_EXACT_REVIEWED_STAGE6_PLAN'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stage6-infrastructure-provisioning
    steps:
      - name: Check out protected validator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact plan source SHA separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.plan_sha }}
          path: plan-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact plan and protected-main authority
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_SHA: ${{ inputs.plan_sha }}
          PLAN_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
          PLAN_ARTIFACT_DIGEST: ${{ inputs.plan_artifact_digest }}
        run: |
          test "$PLAN_RUN_ID" = "$REVIEWED_PLAN_RUN_ID"
          test "$PLAN_SHA" = "$REVIEWED_PLAN_SHA"
          test "$PLAN_ARTIFACT_NAME" = "$REVIEWED_ARTIFACT_NAME"
          test "$PLAN_ARTIFACT_DIGEST" = "$REVIEWED_ARTIFACT_DIGEST"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C plan-source rev-parse HEAD)" = "$REVIEWED_PLAN_SHA"
          git merge-base --is-ancestor "$REVIEWED_PLAN_SHA" "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C plan-source status --porcelain)"
      - name: Verify GitHub artifact authority
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_SHA: ${{ inputs.plan_sha }}
          PLAN_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
          PLAN_ARTIFACT_DIGEST: ${{ inputs.plan_artifact_digest }}
        run: python3 scripts/validate_stage6_artifact_authority.py
      - name: Download exact cross-run artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: /tmp/stage6-reviewed-plan
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
      - name: Verify internal checksums and reviewed resource policy
        run: |
          cd /tmp/stage6-reviewed-plan
          test -f stage6.tfplan
          test -f stage6-plan.json
          test -f stage6-plan.txt
          test -f stage6-plan.SHA256SUMS
          sha256sum -c stage6-plan.SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/validate_stage6_reviewed_plan.py" stage6-plan.json
      - name: Set up pinned OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.6
      - name: Initialize protected remote state and verify saved-plan currency
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          tofu -chdir="$IAC_DIR" init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="endpoints={s3=\"$TF_STATE_ENDPOINT\"}" \
            -backend-config="region=$TF_STATE_REGION"
          tofu -chdir="$IAC_DIR" validate
          unzip -p /tmp/stage6-reviewed-plan/stage6.tfplan tfstate > /tmp/stage6-plan-prior-state.json
          if tofu -chdir="$IAC_DIR" state pull > /tmp/stage6-current-state.json 2>/tmp/stage6-state-pull.err; then
            python3 scripts/validate_stage6_state_currency.py \
              /tmp/stage6-plan-prior-state.json /tmp/stage6-current-state.json
          else
            grep -q 'No state file was found' /tmp/stage6-state-pull.err
            python3 scripts/validate_stage6_state_currency.py \
              /tmp/stage6-plan-prior-state.json NONE
          fi
      - name: Record independently verified apply authority
        run: |
          {
            echo 'SOURCE_ARTIFACT_DIGEST=PASS'
            echo 'PLAN_INTERNAL_CHECKSUM=PASS'
            echo 'REMOTE_STATE=PASS'
            echo 'SAVED_PLAN_STATE_CURRENT=YES'
            echo 'PLAN_CREATE_COUNT=8'
            echo 'PLAN_UPDATE_COUNT=0'
            echo 'PLAN_DELETE_COUNT=0'
            echo 'APPLY_ENVIRONMENT_APPROVAL=PENDING'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-exact-reviewed-plan:
    needs: verify-reviewed-plan
    if: github.ref == 'refs/heads/main' && github.ref_protected == true && inputs.mode == 'APPLY_REVIEWED_STAGE6_PLAN' && inputs.confirmation == 'APPLY_EXACT_REVIEWED_STAGE6_PLAN'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stage6-infrastructure-provisioning
    steps:
      - name: Check out protected validator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact plan source SHA separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.plan_sha }}
          path: plan-source
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify exact plan authority
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_SHA: ${{ inputs.plan_sha }}
          PLAN_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
          PLAN_ARTIFACT_DIGEST: ${{ inputs.plan_artifact_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$PLAN_RUN_ID" = "$REVIEWED_PLAN_RUN_ID"
          test "$PLAN_SHA" = "$REVIEWED_PLAN_SHA"
          test "$PLAN_ARTIFACT_NAME" = "$REVIEWED_ARTIFACT_NAME"
          test "$PLAN_ARTIFACT_DIGEST" = "$REVIEWED_ARTIFACT_DIGEST"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C plan-source rev-parse HEAD)" = "$REVIEWED_PLAN_SHA"
          git merge-base --is-ancestor "$REVIEWED_PLAN_SHA" "$GITHUB_SHA"
          python3 scripts/validate_stage6_artifact_authority.py
      - name: Download exact cross-run artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: /tmp/stage6-reviewed-plan
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
      - name: Reverify internal checksums and reviewed resource policy
        run: |
          cd /tmp/stage6-reviewed-plan
          sha256sum -c stage6-plan.SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/validate_stage6_reviewed_plan.py" stage6-plan.json
      - name: Set up pinned OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.6
      - name: Reverify remote state immediately before apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          tofu -chdir="$IAC_DIR" init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="endpoints={s3=\"$TF_STATE_ENDPOINT\"}" \
            -backend-config="region=$TF_STATE_REGION"
          unzip -p /tmp/stage6-reviewed-plan/stage6.tfplan tfstate > /tmp/stage6-plan-prior-state.json
          if tofu -chdir="$IAC_DIR" state pull > /tmp/stage6-current-state.json 2>/tmp/stage6-state-pull.err; then
            python3 scripts/validate_stage6_state_currency.py \
              /tmp/stage6-plan-prior-state.json /tmp/stage6-current-state.json
          else
            grep -q 'No state file was found' /tmp/stage6-state-pull.err
            python3 scripts/validate_stage6_state_currency.py \
              /tmp/stage6-plan-prior-state.json NONE
          fi
      - name: Apply only the exact reviewed binary plan
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_CLOUD_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        run: tofu -chdir="$IAC_DIR" apply -input=false /tmp/stage6-reviewed-plan/stage6.tfplan
