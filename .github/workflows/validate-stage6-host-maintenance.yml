name: Validate Stage 6 host maintenance

on:
  pull_request:
    paths:
      - "operations/stage6-host-seccomp-maintenance.yaml"
      - "docs/STAGE6-SECCOMP-MAINTENANCE-RUNBOOK-20260831.md"
      - "scripts/validate_stage6_host_maintenance.py"
      - "operations/stage6-container-runtime-rollback-experiment.yaml"
      - "docs/STAGE6-CONTAINER-RUNTIME-ROLLBACK-EXPERIMENT-20260831.md"
      - "scripts/validate_stage6_container_runtime_experiment.py"
      - ".github/workflows/validate-stage6-host-maintenance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input pyyaml==6.0.2
      - run: python scripts/validate_stage6_host_maintenance.py
      - run: python scripts/validate_stage6_container_runtime_experiment.py
