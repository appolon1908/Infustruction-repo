[extend]
useDefault = true

[[allowlists]]
description = "Reviewed Stage 6 Keycloak Git SHA field; not credential material"
condition = "AND"
paths = ['''^STAGE6-SOURCE-LOCK\.yaml$''']
regexTarget = "line"
regexes = ['''^\s*keycloak_locked_sha:\s*[0-9a-f]{40}\s*$''']

[[allowlists]]
description = "Historical PR 30 Keycloak merge 48 Git SHA; verified Git object, not credential material"
condition = "AND"
paths = ['''^reports/runtime-reconciliation/pr-30-runtime-certification-20260831/STAGE6-SOURCE-LOCK\.yaml$''']
regexTarget = "line"
regexes = ['''^\s*keycloak_locked_sha:\s*80fc33c7159440e357219903f62ea7fb84914d59\s*$''']

# Gitleaks joins an archived search expression to the following Podman command.
# Match the exact non-secret process identity and command in this evidence file,
# never a file-wide exception or an exception for arbitrary numeric credentials.
[[allowlists]]
description = "Archived Podman UID:GID, incorrectly joined to the preceding search expression"
targetRules = ["curl-auth-user"]
condition = "AND"
paths = ['''^evidence/server-a-consolidation-20260901/PRODUCTION-SAFETY-SWITCH-INVENTORY\.md$''']
regexTarget = "match"
regexes = ['''/opt/codestra/backups/middleware-control-plane-20260815T073500Z/compose/telephony-gateway-schema-aware-ack-release-20260728/deployment-dropin-before\.conf:7:ExecStart=/usr/bin/podman run --rm --name codestra-telephony-event-gateway-rc4 --pull=never --network=host --user=65532:65532(?:\s|$)''']
