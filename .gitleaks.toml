[extend]
useDefault = true

[[allowlists]]
description = "Reviewed Stage 6 Keycloak Git SHA field; not credential material"
condition = "AND"
paths = ['''^STAGE6-SOURCE-LOCK\.yaml$''']
regexes = ['''keycloak_locked_sha:\s*[0-9a-f]{40}''']

[[allowlists]]
description = "Historical PR 30 Keycloak merge 48 Git SHA; verified Git object, not credential material"
condition = "AND"
paths = ['''^reports/runtime-reconciliation/pr-30-runtime-certification-20260831/STAGE6-SOURCE-LOCK\.yaml$''']
regexTarget = "line"
regexes = ['''^\s*keycloak_locked_sha:\s*80fc33c7159440e357219903f62ea7fb84914d59\s*$''']

[[allowlists]]
description = "Reviewed SHA-256 of the immutable Middleware connector CI workflow; not credential material"
condition = "AND"
paths = ['''^\.codestra/validate-production-orchestrator-contract\.py$''']
regexTarget = "line"
regexes = ['''917ab06febf30f0d81146fc147794dace9510f7bb0a6fb903dd69b2244d4e1d0''']
